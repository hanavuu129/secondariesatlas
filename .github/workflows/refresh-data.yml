name: Refresh news and jobs data

on:
  schedule:
    - cron: "0 11 * * *"   # every day 11:00 UTC (~7am ET)
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch news and jobs
        run: |
          python3 - <<'PY'
          import json, re, ssl, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          UA = {"User-Agent": "Mozilla/5.0 (SecondariesAtlas data refresh; personal educational site)"}
          CTX = ssl.create_default_context()

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout, context=CTX) as r:
                  return r.read()

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")

          # ---------- NEWS: Bing News RSS (direct publisher links + real snippets) ----------
          QUERIES = [
              '"continuation vehicle" private equity',
              '"private equity secondaries"',
              '"GP-led" secondary',
              'secondaries fund close',
              'LP portfolio sale private equity',
          ]

          def strip_tags(s):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s or "")).strip()

          STOP = set("the a an of to for in on and or as at by with from its his her "
                     "their over into after amid up out new says say said".split())

          def toks(title):
              return set(w for w in re.findall(r"[a-z0-9$.]+", title.lower())
                         if len(w) > 2 and w not in STOP)

          MONEYP = re.compile(r"^[\$]?\d+(?:\.\d+)?(?:bn|b|m|mn|billion|million)?$")
          GENERIC = set("secondaries secondary fund funds private equity capital "
                        "partners close closes closed raises raise record latest "
                        "flagship debut billion million".split())

          def is_dup(tk, kt):
              inter = tk & kt
              if not inter:
                  return False
              if len(inter) / max(len(tk | kt), 1) > 0.6:
                  return True
              money = [w for w in inter if MONEYP.match(w)]
              distinct = [w for w in inter if not MONEYP.match(w) and w not in GENERIC]
              return bool(money) and bool(distinct)

          items, seen_keys, kept_toks = [], set(), []
          for q in QUERIES:
              url = ("https://www.bing.com/news/search?q="
                     + urllib.parse.quote(q) + "&format=rss")
              try:
                  root = ET.fromstring(get(url))
                  for it in root.iter("item"):
                      title = strip_tags(it.findtext("title") or "")
                      link = (it.findtext("link") or "").strip()
                      pub = (it.findtext("pubDate") or "").strip()
                      desc = it.findtext("description") or ""
                      source = (it.findtext("{*}Source") or "").strip()
                      if not source and "//" in link:
                          source = link.split("//", 1)[1].split("/", 1)[0].replace("www.", "")
                      if not title or not link:
                          continue
                      key = re.sub(r"\W+", "", title.lower())[:80]
                      if key in seen_keys:
                          continue
                      tk = toks(title)
                      if tk and any(is_dup(tk, kt) for kt in kept_toks):
                          continue  # near-duplicate of a story already kept
                      seen_keys.add(key)
                      kept_toks.append(tk)
                      try:
                          dt = parsedate_to_datetime(pub)
                          date, ts = dt.strftime("%b %d"), dt.timestamp()
                      except Exception:
                          date, ts = "", 0
                      items.append({"title": title, "link": link, "source": source,
                                    "date": date, "_ts": ts, "_desc": desc})
              except Exception as e:
                  print("news query failed:", q, e)

          items.sort(key=lambda x: -x["_ts"])
          items = items[:25]
          for it in items:
              it.pop("_ts", None)

          # ---------- summaries: og:description -> RSS snippet -> context line ----------
          import html as _html

          BOILER = ["aggregated from sources all over the world",
                    "comprehensive up-to-date news coverage", "google news",
                    "bing.com", "msn.com"]

          def clean_summary(s, title):
              s = (s or "").strip()
              if not s or len(s) < 35:
                  return ""
              low = s.lower()
              if any(b in low for b in BOILER):
                  return ""
              if low.startswith(title[:30].lower()):
                  return ""
              return s

          def og_desc(url):
              if "news.google." in url or "bing.com" in url or "msn.com" in url:
                  return ""
              try:
                  page = get(url, timeout=8).decode("utf-8", "ignore")
              except Exception:
                  return ""
              pats = [
                  r'<meta[^>]+property=["\']og:description["\'][^>]*content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]*property=["\']og:description',
                  r'<meta[^>]+name=["\']description["\'][^>]*content=["\']([^"\']+)',
              ]
              for p in pats:
                  m = re.search(p, page, re.I)
                  if m:
                      return _html.unescape(m.group(1)).strip()
              return ""

          def context_line(title):
              tl = title.lower()
              if "continuation" in tl or "single-asset" in tl or "sacv" in tl:
                  return "GP-led continuation-vehicle activity - the market's dominant deal type."
              if "credit" in tl:
                  return "Credit secondaries - the market's fastest-growing vertical."
              if any(k in tl for k in ["fundrais", "closes", "close ", "raises", "raise ", "hard cap"]):
                  return "Capital formation on the buyside - watch dry powder vs. deal supply."
              if any(k in tl for k in ["sells", "sale", "portfolio", "divest"]):
                  return "LP-led supply - institutions using secondaries for portfolio management."
              if any(k in tl for k in ["hires", "joins", "appoints", "promotes", "names "]):
                  return "People move - team buildouts track where firms see deal flow."
              if any(k in tl for k in ["report", "survey", "volume", "outlook", "record"]):
                  return "Market data - candidate material for the stats you quote in interviews."
              return "Secondary-market development worth logging."

          for i, it in enumerate(items):
              summ = clean_summary(og_desc(it["link"]), it["title"]) if i < 14 else ""
              if not summ:
                  summ = clean_summary(strip_tags(it.get("_desc", "")), it["title"])
              if not summ:
                  summ = context_line(it["title"])
              it["summary"] = (summ[:277] + "...") if len(summ) > 280 else summ
              it.pop("_desc", None)

          # ---------- JOBS: Greenhouse + Lever public boards ----------
          # Tokens are best-effort guesses; 404s are skipped silently.
          # Add/remove tokens by editing these lists - the board token is the
          # last path segment of a firm's boards.greenhouse.io / jobs.lever.co page.
          GREENHOUSE = ["stepstonegroup", "hamiltonlane", "harbourvest",
                        "adamsstreetpartners", "industryventures", "collercapital",
                        "pantheon", "gsquared", "newviewcapital", "tpg",
                        "generalatlantic", "vistaequitypartners"]
          LEVER = ["stepstone", "industryventures", "gsquared"]
          KEYWORDS = ["second", "co-invest", "coinvest", "continuation",
                      "fund invest", "gp-led", "gp led", "portfolio finance",
                      "primaries", "nav lending", "nav financ"]

          def match(title):
              t = title.lower()
              return any(k in t for k in KEYWORDS)

          jobs, sources_ok = [], []
          for tok in GREENHOUSE:
              try:
                  data = json.loads(get(
                      "https://boards-api.greenhouse.io/v1/boards/%s/jobs" % tok))
                  sources_ok.append(tok)
                  for j in data.get("jobs", []):
                      if match(j.get("title", "")):
                          jobs.append({
                              "firm": tok, "title": j.get("title", ""),
                              "location": (j.get("location") or {}).get("name", ""),
                              "url": j.get("absolute_url", "")})
              except Exception:
                  pass
          for tok in LEVER:
              try:
                  data = json.loads(get(
                      "https://api.lever.co/v0/postings/%s?mode=json" % tok))
                  sources_ok.append("lever:" + tok)
                  for j in data:
                      if match(j.get("text", "")):
                          jobs.append({
                              "firm": tok, "title": j.get("text", ""),
                              "location": (j.get("categories") or {}).get("location", ""),
                              "url": j.get("hostedUrl", "")})
              except Exception:
                  pass
          jobs = jobs[:40]

          import os
          os.makedirs("data", exist_ok=True)
          with open("data/news.json", "w") as f:
              json.dump({"updated": now, "items": items}, f, indent=1)
          with open("data/jobs.json", "w") as f:
              json.dump({"updated": now, "jobs": jobs, "sources_ok": sources_ok},
                        f, indent=1)
          print("news:", len(items), "| jobs:", len(jobs),
                "| feeds ok:", sources_ok)
          PY

      - name: Commit if changed
        run: |
          git config user.name "atlas-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
